# Reverse proxy for the EcoFlow controller portal.
# Install to /etc/nginx/conf.d/ecoflow-controller.conf and ensure the http{}
# block in /etc/nginx/nginx.conf contains:  include /etc/nginx/conf.d/*.conf;
#
# Also add to /etc/hosts (on each client that should resolve the name):
#   127.0.0.1   ecoflow-controller.local
server {
    # default_server + "_" makes this block answer for ANY hostname that
    # reaches the box (its mDNS hostname <host>.local, its LAN IP, or the
    # ecoflow-controller.local /etc/hosts alias if present on the client).
    listen 80 default_server;
    server_name ecoflow-controller.local _;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # status polling is light; keep connections snappy
        proxy_read_timeout 30s;
    }
}
