# Reverse proxy for the EcoFlow controller portal.
# Only ecoflow-controller.lan is routed to the portal; any other Host (the raw
# LAN IP, the box's mDNS hostname, stray Host headers) is refused by the
# default_server below.
#
# Install to /etc/nginx/conf.d/ecoflow-controller.conf and ensure the http{}
# block in /etc/nginx/nginx.conf contains:  include /etc/nginx/conf.d/*.conf;
#
# Resolve ecoflow-controller.lan to this box's LAN IP via your router's DNS
# (a non-.local name so macOS/iOS use unicast DNS instead of mDNS).

# Catch-all: drop anything we don't explicitly serve.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# The portal, served only under its name.
server {
    listen 80;
    server_name ecoflow-controller.lan;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # status polling is light; keep connections snappy
        proxy_read_timeout 30s;
    }
}
