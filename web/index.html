<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoFlow Parallel Controller</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --fg:#e6edf3; --muted:#8b98a5;
          --on:#2ea043; --charge:#d29922; --off:#6e7681; --accent:#388bfd; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 20px; border-bottom:1px solid #222c3a; display:flex;
           align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .pill { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.auto { background:rgba(46,160,67,.18); color:var(--on); }
  .pill.manual { background:rgba(210,153,34,.18); color:var(--charge); }
  .pill.win { background:rgba(56,139,253,.18); color:var(--accent); }
  main { max-width:760px; margin:0 auto; padding:20px; }
  .units { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:560px){ .units{ grid-template-columns:1fr; } }
  .unit { background:var(--card); border-radius:12px; padding:16px; border:1px solid #222c3a; }
  .unit.charging { border-color:var(--charge); }
  .unit .key { font-size:13px; color:var(--muted); font-family:ui-monospace,monospace; }
  .soc { font-size:42px; font-weight:700; margin:6px 0; }
  .bar { height:8px; background:#0c1118; border-radius:6px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .badge { display:inline-block; padding:2px 9px; border-radius:6px; font-size:12px; font-weight:600; }
  .badge.on { background:rgba(46,160,67,.18); color:var(--on); }
  .badge.charge { background:rgba(210,153,34,.18); color:var(--charge); }
  .badge.off { background:rgba(110,118,129,.2); color:var(--off); }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; line-height:1.6; }
  .controls { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
  button { background:var(--card); color:var(--fg); border:1px solid #2d3a4d;
           padding:10px 16px; border-radius:9px; font-size:14px; cursor:pointer; font-weight:600; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .policy { margin-top:22px; color:var(--muted); font-size:12px; line-height:1.7;
            border-top:1px solid #222c3a; padding-top:14px; }
  .err { color:var(--err); font-size:13px; margin-top:10px; min-height:18px; }
  .ts { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>EcoFlow Parallel Controller</h1>
  <div id="flags"></div>
</header>
<main>
  <div class="units" id="units"></div>
  <div class="controls">
    <button class="primary" data-action="auto">Resume Auto</button>
    <button data-action="both_on">Both ON</button>
    <button data-action="charge" data-unit="0" id="chgA">Charge A</button>
    <button data-action="charge" data-unit="1" id="chgB">Charge B</button>
  </div>
  <div class="err" id="err"></div>
  <div class="policy" id="policy"></div>
  <div class="ts" id="ts"></div>
</main>
<script>
let unitKeys = [];

function badge(u) {
  if (u.charging) return '<span class="badge charge">CHARGING</span>';
  if (u.on === true) return '<span class="badge on">ON (discharge)</span>';
  if (u.on === false) return '<span class="badge off">OFF</span>';
  return '<span class="badge off">?</span>';
}

function render(s) {
  unitKeys = s.units.map(u => u.key);
  // flags
  const f = [];
  f.push(s.automation_enabled
    ? '<span class="pill auto">AUTO</span>'
    : '<span class="pill manual">MANUAL</span>');
  if (s.in_window) f.push('<span class="pill win">NIGHT WINDOW</span>');
  document.getElementById('flags').innerHTML = f.join(' ');

  // units
  document.getElementById('units').innerHTML = s.units.map((u, i) => {
    const soc = (u.soc == null) ? '--' : u.soc;
    const pct = (u.soc == null) ? 0 : u.soc;
    const label = String.fromCharCode(65 + i); // A / B
    return `<div class="unit ${u.charging ? 'charging' : ''}">
      <div class="key">Unit ${label} &middot; ${u.key}</div>
      <div class="soc">${soc}<span style="font-size:18px;color:var(--muted)">%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${badge(u)}
      <div class="meta">
        access_5p8_out_type: ${u.access_5p8_out_type ?? '—'}<br>
        show_flag: ${u.show_flag ?? '—'}<br>
        heartbeat age: ${u.age_s == null ? '—' : u.age_s + 's'}
      </div>
    </div>`;
  }).join('');

  // policy
  const p = s.policy;
  document.getElementById('policy').innerHTML =
    `<b>Policy</b> &mdash; default BOTH ON. Charge lower unit when: ` +
    `SoC&le;${p.floor_soc}% (floor), or &le;${p.early_soc}% &amp; both&lt;${p.early_both_below}% (early), ` +
    `or window &amp; &lt;${p.window_soc}% (topup). Charge to ${p.target_soc}% then re-evaluate. ` +
    `Night window ${p.window_start}&ndash;${p.window_end} UTC. Make-before-break settle ${s.settle_seconds}s.`;
  document.getElementById('ts').textContent =
    'updated ' + new Date(s.ts * 1000).toLocaleTimeString();
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    render(await r.json());
    document.getElementById('err').textContent = '';
  } catch (e) {
    document.getElementById('err').textContent = 'status fetch failed: ' + e;
  }
}

async function control(action, unitIdx) {
  const body = { action };
  if (action === 'charge') body.unit = unitKeys[unitIdx];
  try {
    const r = await fetch('/api/control', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (j.error) { document.getElementById('err').textContent = 'error: ' + j.error; }
    else { render(j); document.getElementById('err').textContent = ''; }
  } catch (e) {
    document.getElementById('err').textContent = 'control failed: ' + e;
  }
}

document.querySelectorAll('button[data-action]').forEach(b => {
  b.addEventListener('click', () =>
    control(b.dataset.action, b.dataset.unit ? parseInt(b.dataset.unit) : null));
});

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
