<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoFlow Parallel Controller</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --fg:#e6edf3; --muted:#8b98a5;
          --on:#2ea043; --charge:#d29922; --off:#6e7681; --accent:#388bfd; --err:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 20px; border-bottom:1px solid #222c3a; display:flex;
           align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  .pill { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; }
  .pill.auto { background:rgba(46,160,67,.18); color:var(--on); }
  .pill.manual { background:rgba(210,153,34,.18); color:var(--charge); }
  .pill.win { background:rgba(56,139,253,.18); color:var(--accent); }
  main { max-width:760px; margin:0 auto; padding:20px; }
  .units { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:560px){ .units{ grid-template-columns:1fr; } }
  .unit { background:var(--card); border-radius:12px; padding:16px; border:1px solid #222c3a; }
  .unit.charging { border-color:var(--charge); }
  .unit .key { font-size:13px; color:var(--muted); font-family:ui-monospace,monospace; }
  .soc { font-size:42px; font-weight:700; margin:6px 0; }
  .bar { height:8px; background:#0c1118; border-radius:6px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .badge { display:inline-block; padding:2px 9px; border-radius:6px; font-size:12px; font-weight:600; }
  .badge.on { background:rgba(46,160,67,.18); color:var(--on); }
  .badge.charge { background:rgba(210,153,34,.18); color:var(--charge); }
  .badge.off { background:rgba(110,118,129,.2); color:var(--off); }
  .eta { margin-top:10px; font-size:13px; font-weight:600; color:var(--fg); }
  .meta { color:var(--muted); font-size:12px; margin-top:8px; line-height:1.6; }
  .controls { margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; }
  button { background:var(--card); color:var(--fg); border:1px solid #2d3a4d;
           padding:10px 16px; border-radius:9px; font-size:14px; cursor:pointer; font-weight:600; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .mh { font-size:14px; font-weight:600; margin:26px 0 10px; color:var(--fg); }
  .seg { display:inline-flex; gap:0; margin-bottom:12px; border:1px solid #2d3a4d; border-radius:8px; overflow:hidden; }
  .segbtn { background:var(--card); border:0; border-radius:0; padding:6px 14px; font-size:13px; }
  .segbtn.active { background:var(--accent); color:#fff; }
  table.m { width:100%; border-collapse:collapse; font-size:13px; }
  table.m th, table.m td { text-align:right; padding:7px 8px; border-bottom:1px solid #222c3a; }
  table.m th:first-child, table.m td:first-child { text-align:left; font-family:ui-monospace,monospace; color:var(--muted); }
  table.m thead th { color:var(--muted); font-weight:600; }
  table.m tfoot td { font-weight:700; border-top:2px solid #2d3a4d; border-bottom:0; }
  .solar { color:var(--charge); }
  .chart { background:var(--card); border:1px solid #222c3a; border-radius:10px; padding:10px 12px; margin:10px 0; }
  .chart .cap { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .chart canvas { width:100%; display:block; }
  .legend { font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:11px; height:3px; display:inline-block; border-radius:2px; }
  .policy { margin-top:22px; color:var(--muted); font-size:12px; line-height:1.7;
            border-top:1px solid #222c3a; padding-top:14px; }
  .err { color:var(--err); font-size:13px; margin-top:10px; min-height:18px; }
  .ts { color:var(--muted); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>EcoFlow Parallel Controller</h1>
  <div id="flags"></div>
</header>
<main>
  <div class="units" id="units"></div>
  <div class="controls">
    <button class="primary" data-action="auto">Resume Auto</button>
    <button data-action="both_on">Both ON</button>
    <button data-action="charge" data-unit="0" id="chgA">Charge A</button>
    <button data-action="charge" data-unit="1" id="chgB">Charge B</button>
  </div>
  <div class="err" id="err"></div>
  <h2 class="mh">Energy &amp; usage</h2>
  <div class="seg" id="seg">
    <button class="segbtn active" data-scope="today">Today</button>
    <button class="segbtn" data-scope="all_time">All time</button>
  </div>
  <div id="metrics"></div>
  <h2 class="mh">Last 24h</h2>
  <div class="chart"><div class="cap">State of charge (%)</div>
    <canvas id="socChart" height="160"></canvas></div>
  <div class="chart"><div class="cap">Power (W) — solar, grid in, output</div>
    <canvas id="pwrChart" height="160"></canvas></div>
  <div class="legend" id="legend"></div>
  <div class="policy" id="policy"></div>
  <div class="ts" id="ts"></div>
</main>
<script>
let unitKeys = [];

function badge(u) {
  if (u.charging) return '<span class="badge charge">CHARGING</span>';
  if (u.on === true) return '<span class="badge on">ON (discharge)</span>';
  if (u.on === false) return '<span class="badge off">OFF</span>';
  return '<span class="badge off">?</span>';
}

function fmtDur(s) {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}

function etaLine(u) {
  if (!u.eta) {
    if (u.charging) return '⚡ reactivation ETA: estimating rate…';
    if (u.on === true) return '🪫 charge ETA: estimating rate…';
    return '';
  }
  const when = new Date(u.eta.ts * 1000)
    .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const rate = u.eta.rate_pct_per_hr;
  if (u.eta.kind === 'reactivate')
    return `⚡ reactivates (→${u.eta.target}%) in ${fmtDur(u.eta.seconds)} · ≈${when} · +${rate}%/h`;
  return `🪫 needs charge (→${u.eta.target}%) in ${fmtDur(u.eta.seconds)} · ≈${when} · ${rate}%/h`;
}

function render(s) {
  unitKeys = s.units.map(u => u.key);
  // flags
  const f = [];
  f.push(s.automation_enabled
    ? '<span class="pill auto">AUTO</span>'
    : '<span class="pill manual">MANUAL</span>');
  if (s.in_window) f.push('<span class="pill win">NIGHT WINDOW</span>');
  document.getElementById('flags').innerHTML = f.join(' ');

  // units
  document.getElementById('units').innerHTML = s.units.map((u, i) => {
    const soc = (u.soc == null) ? '--' : u.soc;
    const pct = (u.soc == null) ? 0 : u.soc;
    const label = String.fromCharCode(65 + i); // A / B
    return `<div class="unit ${u.charging ? 'charging' : ''}">
      <div class="key">Unit ${label} &middot; ${u.key}</div>
      <div class="soc">${soc}<span style="font-size:18px;color:var(--muted)">%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${badge(u)}
      <div class="eta">${etaLine(u)}</div>
      <div class="meta">
        access_5p8_out_type: ${u.access_5p8_out_type ?? '—'}<br>
        show_flag: ${u.show_flag ?? '—'}<br>
        heartbeat age: ${u.age_s == null ? '—' : u.age_s + 's'}
      </div>
    </div>`;
  }).join('');

  // policy
  const p = s.policy;
  document.getElementById('policy').innerHTML =
    `<b>Policy</b> &mdash; default BOTH ON. Charge lower unit when: ` +
    `SoC&le;${p.floor_soc}% (floor), or &le;${p.early_soc}% &amp; both&lt;${p.early_both_below}% (early), ` +
    `or window &amp; &lt;${p.window_soc}% (topup). Charge to ${p.target_soc}% then re-evaluate. ` +
    `<b>Critical override:</b> if the discharging unit hits &le;${p.critical_soc}%, switch immediately. ` +
    `Night window ${p.window_start}&ndash;${p.window_end} UTC. Make-before-break settle ${s.settle_seconds}s.`;
  document.getElementById('ts').textContent =
    'updated ' + new Date(s.ts * 1000).toLocaleTimeString();
}

let metricsScope = 'today';

function fmtHrs(s) {
  if (s == null) return '—';
  const h = s / 3600;
  return h >= 1 ? h.toFixed(1) + 'h' : (s / 60).toFixed(0) + 'm';
}
function kwh(wh) { return wh == null ? '—' : (wh / 1000).toFixed(2); }

function renderMetrics(m) {
  if (!m || m.error) {
    document.getElementById('metrics').innerHTML =
      '<div class="meta">metrics unavailable</div>';
    return;
  }
  const scope = m[metricsScope];
  const units = Object.keys(scope.per_unit);
  const row = (label, u) =>
    `<tr><td>${label}</td>
       <td>${fmtHrs(u.charge_s)}</td>
       <td class="solar">${kwh(u.solar_wh)}</td>
       <td>${kwh(u.grid_wh)}</td>
       <td>${kwh(u.in_wh)}</td>
       <td>${kwh(u.out_wh)}</td>
       <td>${kwh(u.delta_wh)}</td>
       <td>${kwh(u.loss_wh)}</td></tr>`;
  const body = units.map((k, i) =>
    row('Unit ' + String.fromCharCode(65 + i) + ' · ' + k, scope.per_unit[k])).join('');
  const t = scope.totals;
  document.getElementById('metrics').innerHTML = `
    <table class="m">
      <thead><tr><th>unit</th><th>charging</th><th>solar kWh</th>
        <th>grid kWh</th><th>in kWh</th><th>out kWh</th><th>in&minus;out</th>
        <th>loss kWh</th></tr></thead>
      <tbody>${body || '<tr><td colspan=8 class="meta">no data yet</td></tr>'}</tbody>
      <tfoot><tr><td>Total</td><td>${fmtHrs(t.charge_s)}</td>
        <td class="solar">${kwh(t.solar_wh)}</td><td>${kwh(t.grid_wh)}</td>
        <td>${kwh(t.in_wh)}</td><td>${kwh(t.out_wh)}</td><td>${kwh(t.delta_wh)}</td>
        <td>${kwh(t.loss_wh)}</td></tr></tfoot>
    </table>
    <div class="meta">in&minus;out = stored in batteries + losses. <b>loss</b> = in&minus;out
      &minus; battery &Delta;SoC&times;capacity (estimated true conversion/standby loss).</div>`;
}

async function refreshMetrics() {
  try {
    const r = await fetch('/api/metrics');
    renderMetrics(await r.json());
  } catch (e) { /* keep previous */ }
}

document.querySelectorAll('.segbtn').forEach(b => {
  b.addEventListener('click', () => {
    metricsScope = b.dataset.scope;
    document.querySelectorAll('.segbtn').forEach(x => x.classList.toggle('active', x === b));
    refreshMetrics();
  });
});

const COL = { A: '#388bfd', B: '#2ea043', solar: '#d29922', grid: '#58a6ff', out: '#f85149' };

function drawChart(canvas, series, ymin, ymax) {
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 600, cssH = canvas.height;
  canvas.width = cssW * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  const padL = 34, padR = 6, padT = 8, padB = 6;
  const W = cssW - padL - padR, H = cssH - padT - padB;
  let xmin = Infinity, xmax = -Infinity;
  series.forEach(s => s.pts.forEach(p => {
    if (p[1] == null) return;
    if (p[0] < xmin) xmin = p[0]; if (p[0] > xmax) xmax = p[0];
  }));
  if (!isFinite(xmin) || xmax <= xmin) {
    ctx.fillStyle = '#8b98a5'; ctx.font = '12px sans-serif';
    ctx.fillText('collecting…', padL, padT + H / 2); return;
  }
  if (ymin == null || ymax == null) {
    ymin = Infinity; ymax = -Infinity;
    series.forEach(s => s.pts.forEach(p => {
      if (p[1] == null) return;
      if (p[1] < ymin) ymin = p[1]; if (p[1] > ymax) ymax = p[1];
    }));
    if (ymin === ymax) ymax = ymin + 1;
  }
  const X = t => padL + (t - xmin) / (xmax - xmin) * W;
  const Y = v => padT + (1 - (v - ymin) / (ymax - ymin)) * H;
  ctx.strokeStyle = '#222c3a'; ctx.fillStyle = '#8b98a5';
  ctx.font = '10px sans-serif'; ctx.lineWidth = 1;
  for (let i = 0; i <= 2; i++) {
    const v = ymin + (ymax - ymin) * i / 2, y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + W, y); ctx.stroke();
    ctx.fillText(Math.round(v), 2, y + 3);
  }
  series.forEach(s => {
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.6;
    ctx.setLineDash(s.dash ? [3, 3] : []);
    ctx.beginPath(); let started = false;
    s.pts.forEach(p => {
      if (p[1] == null) { started = false; return; }
      const x = X(p[0]), y = Y(p[1]);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });
  ctx.setLineDash([]);
}

function lineFor(arr, key) { return arr.map(s => [s.ts, s[key]]); }

function renderHistory(hist) {
  const units = Object.keys(hist);
  const soc = units.map((u, i) => ({ pts: lineFor(hist[u], 'soc'), color: i === 0 ? COL.A : COL.B, dash: i > 0 }));
  drawChart(document.getElementById('socChart'), soc, 0, 100);
  const pwr = [];
  units.forEach((u, i) => {
    pwr.push({ pts: lineFor(hist[u], 'solar_w'), color: COL.solar, dash: i > 0 });
    pwr.push({ pts: lineFor(hist[u], 'grid_w'), color: COL.grid, dash: i > 0 });
    pwr.push({ pts: lineFor(hist[u], 'watts_out'), color: COL.out, dash: i > 0 });
  });
  drawChart(document.getElementById('pwrChart'), pwr, null, null);
  const uleg = units.map((u, i) =>
    `<span><i style="background:${i === 0 ? COL.A : COL.B}"></i>Unit ${String.fromCharCode(65 + i)}</span>`).join('');
  document.getElementById('legend').innerHTML = uleg +
    ` &nbsp;|&nbsp; <span><i style="background:${COL.solar}"></i>solar</span>` +
    `<span><i style="background:${COL.grid}"></i>grid</span>` +
    `<span><i style="background:${COL.out}"></i>output</span> (unit B dashed)`;
}

async function refreshHistory() {
  try {
    const r = await fetch('/api/history?hours=24');
    renderHistory(await r.json());
  } catch (e) { /* keep previous */ }
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    render(await r.json());
    document.getElementById('err').textContent = '';
  } catch (e) {
    document.getElementById('err').textContent = 'status fetch failed: ' + e;
  }
}

async function control(action, unitIdx) {
  const body = { action };
  if (action === 'charge') body.unit = unitKeys[unitIdx];
  try {
    const r = await fetch('/api/control', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (j.error) { document.getElementById('err').textContent = 'error: ' + j.error; }
    else { render(j); document.getElementById('err').textContent = ''; }
  } catch (e) {
    document.getElementById('err').textContent = 'control failed: ' + e;
  }
}

document.querySelectorAll('button[data-action]').forEach(b => {
  b.addEventListener('click', () =>
    control(b.dataset.action, b.dataset.unit ? parseInt(b.dataset.unit) : null));
});

refresh();
refreshMetrics();
refreshHistory();
setInterval(refresh, 3000);
setInterval(refreshMetrics, 15000);
setInterval(refreshHistory, 60000);
window.addEventListener('resize', refreshHistory);
</script>
</body>
</html>
